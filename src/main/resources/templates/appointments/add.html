<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/sidebar :: body}">
<head><title>New Appointment - iVura</title></head>
<body>
<div th:fragment="content">
    <div class="page-header">
        <div>
            <h1>New Appointment</h1>
            <div class="subtitle">Schedule a patient appointment</div>
        </div>
        <a href="/appointments" class="btn btn-outline">← Back</a>
    </div>

    <div class="section">
        <form th:action="@{/appointments/add}" th:object="${appointmentDto}" method="post" class="form-container">
            <div th:if="${#fields.hasErrors('*')}" class="alert alert-danger">
                Please fix the errors below.
            </div>

            <div class="form-grid">
                <div class="form-group">
                    <label for="patientId">Patient *</label>
                    <select id="patientId" th:field="*{patientId}" required>
                        <option value="">Select patient</option>
                        <option th:each="p : ${patients}" th:value="${p.id}" th:text="${p.fullName}">Patient</option>
                    </select>
                    <span th:if="${#fields.hasErrors('patientId')}" th:errors="*{patientId}" style="color:var(--danger);font-size:12px;"></span>
                </div>
                <div class="form-group">
                    <label for="doctorId">Doctor *</label>
                    <select id="doctorId" th:field="*{doctorId}" required>
                        <option value="">Select doctor</option>
                        <option th:each="d : ${doctors}" th:value="${d.id}" th:text="${d.fullName + ' - ' + d.specialization}">Doctor</option>
                    </select>
                    <span th:if="${#fields.hasErrors('doctorId')}" th:errors="*{doctorId}" style="color:var(--danger);font-size:12px;"></span>
                </div>
                <div class="form-group">
                    <label for="appointmentDate">Date *</label>
                    <input type="date" id="appointmentDate" th:field="*{appointmentDate}" required>
                    <span th:if="${#fields.hasErrors('appointmentDate')}" th:errors="*{appointmentDate}" style="color:var(--danger);font-size:12px;"></span>
                </div>
                <div class="form-group">
                    <label for="appointmentTime">Time *</label>
                    <input type="time" id="appointmentTime" th:field="*{appointmentTime}" required>
                    <span th:if="${#fields.hasErrors('appointmentTime')}" th:errors="*{appointmentTime}" style="color:var(--danger);font-size:12px;"></span>
                </div>
                <div class="form-group full-width">
                    <label for="reason">Reason for Visit</label>
                    <textarea id="reason" th:field="*{reason}" placeholder="Reason for appointment" rows="3"></textarea>
                </div>
                <div class="form-group full-width">
                    <label for="notes">Notes</label>
                    <textarea id="notes" th:field="*{notes}" placeholder="Additional notes" rows="3"></textarea>
                </div>
            </div>

            <div class="form-actions">
                <button type="submit" class="btn btn-primary">Schedule Appointment</button>
                <a href="/appointments" class="btn btn-outline">Cancel</a>
            </div>
        </form>
    </div>
</div>
</body>
</html>
