<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:replace="~{layout/sidebar :: html(#{appointment.title}, ~{::content})}">
<head><title>Appointments - iVura</title></head>
<body>
<div th:fragment="content">
    <div class="page-header">
        <div>
            <h1 th:text="#{appointment.title}">Appointments</h1>
            <div class="subtitle" th:text="#{appointment.subtitle}">Schedule and manage appointments</div>
        </div>
        <a href="/appointments/add" class="btn btn-primary" sec:authorize="hasAuthority('PERM_CREATE_APPOINTMENT')">
            <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <line x1="12" y1="5" x2="12" y2="19"></line>
                <line x1="5" y1="12" x2="19" y2="12"></line>
            </svg>
            <span th:text="#{appointment.add}">New Appointment</span>
        </a>
    </div>

    <div class="section">
        <div class="section-header">
            <h2>
                <span th:text="#{appointment.sectionTitle}">Appointment List</span>
                <span class="section-count" th:text="${#lists.size(appointments)}">0</span>
            </h2>
            <div class="table-toolbar">
                <div class="toolbar-search">
                    <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <circle cx="11" cy="11" r="8"></circle>
                        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                    </svg>
                    <input type="text" class="table-search" th:placeholder="#{common.search}">
                </div>
                <select class="toolbar-filter">
                    <option value="" th:text="#{common.allStatus}">All Status</option>
                    <option value="Scheduled" th:text="#{status.scheduled}">Scheduled</option>
                    <option value="In Progress" th:text="#{status.inProgress}">In Progress</option>
                    <option value="Completed" th:text="#{status.completed}">Completed</option>
                    <option value="Cancelled" th:text="#{status.cancelled}">Cancelled</option>
                    <option value="No Show" th:text="#{status.noShow}">No Show</option>
                </select>
            </div>
        </div>
        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th th:text="#{appointment.table.patient}">Patient</th>
                        <th th:text="#{appointment.table.doctor}">Doctor</th>
                        <th th:text="#{appointment.table.date}">Date</th>
                        <th th:text="#{appointment.table.time}">Time</th>
                        <th th:text="#{appointment.table.reason}">Reason</th>
                        <th th:text="#{appointment.table.status}">Status</th>
                        <th th:text="#{common.actions}">Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="a, stat : ${appointments}" th:attr="data-status=${a.status.name()}">
                        <td>
                            <div class="patient-cell">
                                <div class="avatar"
                                     th:classappend="${stat.index % 6 == 0 ? 'blue' : stat.index % 6 == 1 ? 'green' : stat.index % 6 == 2 ? 'yellow' : stat.index % 6 == 3 ? 'purple' : stat.index % 6 == 4 ? 'pink' : 'teal'}"
                                     th:text="${#strings.substring(a.patient.firstName, 0, 1)}">A</div>
                                <div class="info">
                                    <div class="name" th:text="${a.patient.fullName}">Name</div>
                                </div>
                            </div>
                        </td>
                        <td th:text="${a.doctor.fullName}">Dr. Name</td>
                        <td th:text="${a.appointmentDate}">2024-01-01</td>
                        <td th:text="${a.appointmentTime}">09:00</td>
                        <td th:text="${a.reason}">Checkup</td>
                        <td>
                            <span class="badge badge-info" th:if="${a.status.name() == 'SCHEDULED'}" th:text="#{status.scheduled}">Scheduled</span>
                            <span class="badge badge-success" th:if="${a.status.name() == 'COMPLETED'}" th:text="#{status.completed}">Completed</span>
                            <span class="badge badge-warning" th:if="${a.status.name() == 'IN_PROGRESS'}" th:text="#{status.inProgress}">In Progress</span>
                            <span class="badge badge-danger" th:if="${a.status.name() == 'CANCELLED'}" th:text="#{status.cancelled}">Cancelled</span>
                            <span class="badge badge-secondary" th:if="${a.status.name() == 'NO_SHOW'}" th:text="#{status.noShow}">No Show</span>
                        </td>
                        <td>
                            <div class="btn-group">
                                <a th:href="@{/appointments/status/{id}/{status}(id=${a.id}, status='COMPLETED')}" class="btn btn-success btn-sm" th:if="${a.status.name() == 'SCHEDULED' or a.status.name() == 'IN_PROGRESS'}" th:title="#{status.completed}" sec:authorize="hasAuthority('PERM_EDIT_APPOINTMENT')">
                                    <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                                        <polyline points="20 6 9 17 4 12"></polyline>
                                    </svg>
                                </a>
                                <a th:href="@{/appointments/status/{id}/{status}(id=${a.id}, status='CANCELLED')}" class="btn btn-danger btn-sm" th:if="${a.status.name() == 'SCHEDULED'}" th:title="#{status.cancelled}" sec:authorize="hasAuthority('PERM_CANCEL_APPOINTMENT')">
                                    <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                                        <line x1="18" y1="6" x2="6" y2="18"></line>
                                        <line x1="6" y1="6" x2="18" y2="18"></line>
                                    </svg>
                                </a>
                                <a th:href="@{/appointments/delete/{id}(id=${a.id})}" class="action-icon delete confirm-delete" th:title="#{common.delete}" sec:authorize="hasAuthority('PERM_CANCEL_APPOINTMENT')">
                                    <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                                        <polyline points="3 6 5 6 21 6"></polyline>
                                        <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                                    </svg>
                                </a>
                            </div>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(appointments)}">
                        <td colspan="7">
                            <div class="empty-state">
                                <div class="icon">
                                    <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                                        <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
                                        <line x1="16" y1="2" x2="16" y2="6"></line>
                                        <line x1="8" y1="2" x2="8" y2="6"></line>
                                        <line x1="3" y1="10" x2="21" y2="10"></line>
                                    </svg>
                                </div>
                                <h3 th:text="#{appointment.empty.title}">No appointments yet</h3>
                                <p th:text="#{appointment.empty.subtitle}">Schedule your first appointment</p>
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
</body>
</html>
