<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/sidebar :: html(#{doctor.addTitle}, ~{::content})}">
<head><title>Add Doctor - iVura</title></head>
<body>
<div th:fragment="content">
    <div class="page-header">
        <div>
            <h1 th:text="#{doctor.addTitle}">Add Doctor</h1>
            <div class="subtitle" th:text="#{doctor.addSubtitle}">Register a new doctor</div>
        </div>
        <a href="/doctors" class="btn btn-outline" th:text="#{common.back}">← Back</a>
    </div>

    <div class="section">
        <form th:action="@{/doctors/add}" th:object="${doctorDto}" method="post" class="form-container">
            <div th:replace="~{layout/errors :: error-summary}"></div>

            <div class="form-grid">
                <div class="form-group">
                    <label for="firstName" th:text="#{doctor.firstName}">First Name *</label>
                    <input type="text" id="firstName" th:field="*{firstName}" required>
                    <span th:if="${#fields.hasErrors('firstName')}" th:errors="*{firstName}" style="color:var(--danger);font-size:12px;"></span>
                </div>
                <div class="form-group">
                    <label for="lastName" th:text="#{doctor.lastName}">Last Name *</label>
                    <input type="text" id="lastName" th:field="*{lastName}" required>
                    <span th:if="${#fields.hasErrors('lastName')}" th:errors="*{lastName}" style="color:var(--danger);font-size:12px;"></span>
                </div>
                <div class="form-group">
                    <label for="email" th:text="#{doctor.email}">Email *</label>
                    <input type="email" id="email" th:field="*{email}" required>
                    <span th:if="${#fields.hasErrors('email')}" th:errors="*{email}" style="color:var(--danger);font-size:12px;"></span>
                </div>
                <div class="form-group">
                    <label for="phone" th:text="#{doctor.phone}">Phone</label>
                    <input type="text" id="phone" th:field="*{phone}">
                </div>
                <div class="form-group">
                    <label for="serviceId" th:text="#{doctor.service}">Service</label>
                    <select id="serviceId" th:field="*{serviceId}">
                        <option value="" th:text="#{doctor.serviceSelect}">Select service</option>
                        <option th:each="svc : ${services}" th:value="${svc.id}" th:text="${svc.name + ' - ' + svc.price + ' RWF'}">Cardiology - 20000 RWF</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="licenseNumber" th:text="#{doctor.licenseNumber}">License Number</label>
                    <input type="text" id="licenseNumber" th:field="*{licenseNumber}">
                </div>
                <div class="form-group">
                    <label for="departmentId" th:text="#{doctor.department}">Department</label>
                    <select id="departmentId" th:field="*{departmentId}">
                        <option value="" th:text="#{doctor.deptSelect}">Select department</option>
                        <option th:each="dept : ${departments}" th:value="${dept.id}" th:text="${dept.name}">Dept</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="experienceYears" th:text="#{doctor.experienceYears}">Experience (years)</label>
                    <input type="number" id="experienceYears" th:field="*{experienceYears}" min="0">
                </div>
                <div class="form-group">
                    <label for="consultationFee" th:text="#{doctor.consultationFee}">Consultation Fee</label>
                    <input type="number" id="consultationFee" th:field="*{consultationFee}" step="0.01" min="0">
                </div>
                <div class="form-group">
                    <label for="qualification" th:text="#{doctor.qualification}">Qualification</label>
                    <input type="text" id="qualification" th:field="*{qualification}" th:placeholder="#{doctor.qualificationPh}">
                </div>
                <div class="form-group">
                    <label for="availableFrom" th:text="#{doctor.availableFrom}">Available From</label>
                    <input type="time" id="availableFrom" th:field="*{availableFrom}">
                </div>
                <div class="form-group">
                    <label for="availableTo" th:text="#{doctor.availableTo}">Available To</label>
                    <input type="time" id="availableTo" th:field="*{availableTo}">
                </div>
            </div>

            <div class="form-actions">
                <button type="submit" class="btn btn-primary" th:text="#{doctor.save}">Save Doctor</button>
                <a href="/doctors" class="btn btn-outline" th:text="#{common.cancel}">Cancel</a>
            </div>
        </form>
    </div>
</div>
</body>
</html>
