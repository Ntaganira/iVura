<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/sidebar :: body}">
<head><title>Add Doctor - iVura</title></head>
<body>
<div th:fragment="content">
    <div class="page-header">
        <div>
            <h1>Add Doctor</h1>
            <div class="subtitle">Register a new doctor</div>
        </div>
        <a href="/doctors" class="btn btn-outline">← Back</a>
    </div>

    <div class="section">
        <form th:action="@{/doctors/add}" th:object="${doctorDto}" method="post" class="form-container">
            <div th:if="${#fields.hasErrors('*')}" class="alert alert-danger">
                Please fix the errors below.
            </div>

            <div class="form-grid">
                <div class="form-group">
                    <label for="firstName">First Name *</label>
                    <input type="text" id="firstName" th:field="*{firstName}" required>
                </div>
                <div class="form-group">
                    <label for="lastName">Last Name *</label>
                    <input type="text" id="lastName" th:field="*{lastName}" required>
                </div>
                <div class="form-group">
                    <label for="email">Email *</label>
                    <input type="email" id="email" th:field="*{email}" required>
                </div>
                <div class="form-group">
                    <label for="phone">Phone</label>
                    <input type="text" id="phone" th:field="*{phone}">
                </div>
                <div class="form-group">
                    <label for="specialization">Specialization</label>
                    <input type="text" id="specialization" th:field="*{specialization}" placeholder="e.g., Cardiology">
                </div>
                <div class="form-group">
                    <label for="licenseNumber">License Number</label>
                    <input type="text" id="licenseNumber" th:field="*{licenseNumber}">
                </div>
                <div class="form-group">
                    <label for="departmentId">Department</label>
                    <select id="departmentId" th:field="*{departmentId}">
                        <option value="">Select department</option>
                        <option th:each="dept : ${departments}" th:value="${dept.id}" th:text="${dept.name}">Dept</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="experienceYears">Experience (years)</label>
                    <input type="number" id="experienceYears" th:field="*{experienceYears}" min="0">
                </div>
                <div class="form-group">
                    <label for="consultationFee">Consultation Fee</label>
                    <input type="number" id="consultationFee" th:field="*{consultationFee}" step="0.01" min="0">
                </div>
                <div class="form-group">
                    <label for="qualification">Qualification</label>
                    <input type="text" id="qualification" th:field="*{qualification}" placeholder="MD, PhD, etc.">
                </div>
                <div class="form-group">
                    <label for="availableFrom">Available From</label>
                    <input type="time" id="availableFrom" th:field="*{availableFrom}">
                </div>
                <div class="form-group">
                    <label for="availableTo">Available To</label>
                    <input type="time" id="availableTo" th:field="*{availableTo}">
                </div>
            </div>

            <div class="form-actions">
                <button type="submit" class="btn btn-primary">Save Doctor</button>
                <a href="/doctors" class="btn btn-outline">Cancel</a>
            </div>
        </form>
    </div>
</div>
</body>
</html>
