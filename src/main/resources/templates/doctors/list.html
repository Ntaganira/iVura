<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:replace="~{layout/sidebar :: html(#{doctor.title}, ~{::content})}">
<head><title>Doctors - iVura</title></head>
<body>
<div th:fragment="content">
    <div class="page-header">
        <div>
            <h1 th:text="#{doctor.title}">Doctors</h1>
            <div class="subtitle" th:text="#{doctor.subtitle}">Manage medical staff</div>
        </div>
        <a href="/doctors/add" class="btn btn-primary" sec:authorize="hasAuthority('PERM_CREATE_DOCTOR')">
            <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <line x1="12" y1="5" x2="12" y2="19"></line>
                <line x1="5" y1="12" x2="19" y2="12"></line>
            </svg>
            <span th:text="#{doctor.add}">Add Doctor</span>
        </a>
    </div>

    <div class="section">
        <div class="section-header">
            <h2>
                <span th:text="#{doctor.sectionTitle}">Medical Staff</span>
                <span class="section-count" th:text="${#lists.size(doctors)}">0</span>
            </h2>
            <div class="table-toolbar">
                <div class="toolbar-search">
                    <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <circle cx="11" cy="11" r="8"></circle>
                        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                    </svg>
                    <input type="text" class="table-search" th:placeholder="#{common.search}">
                </div>
            </div>
        </div>
        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th th:text="#{doctor.table.doctor}">Doctor</th>
                        <th th:text="#{doctor.table.specializations}">Specializations</th>
                        <th th:text="#{doctor.table.department}">Department</th>
                        <th th:text="#{doctor.table.services}">Provided Services</th>
                        <th th:text="#{doctor.table.phone}">Phone</th>
                        <th th:text="#{doctor.table.experience}">Experience</th>
                        <th th:text="#{common.actions}">Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="d, stat : ${doctors}">
                        <td>
                            <div class="patient-cell">
                                <div class="avatar"
                                     th:classappend="${stat.index % 6 == 0 ? 'blue' : stat.index % 6 == 1 ? 'green' : stat.index % 6 == 2 ? 'yellow' : stat.index % 6 == 3 ? 'purple' : stat.index % 6 == 4 ? 'pink' : 'teal'}"
                                     th:text="${#strings.substring(d.firstName, 0, 1)}">D</div>
                                <div class="info">
                                    <div class="name" th:text="${d.fullName}">Dr. Name</div>
                                    <div class="email" th:text="${d.email}">email</div>
                                </div>
                            </div>
                        </td>
                        <td>
                            <span th:each="sp : ${d.specializations}" class="badge badge-info" th:text="${sp.name}">Cardiology</span>
                            <span th:if="${#sets.isEmpty(d.specializations)}" th:text="#{common.na}">N/A</span>
                        </td>
                        <td th:text="${d.department?.name}">Dept</td>
                        <td>
                            <span th:each="sv : ${d.services}" class="badge badge-success" th:text="${sv.name}">Cardiology Consultation</span>
                            <span th:if="${#sets.isEmpty(d.services)}" th:text="#{common.na}">N/A</span>
                        </td>
                        <td th:text="${d.phone}">+250...</td>
                        <td th:text="${d.experienceYears} + ' yrs'">5 yrs</td>
                        <td>
                            <div class="btn-group">
                                <a th:href="@{/doctors/edit/{id}(id=${d.id})}" class="action-icon edit" th:title="#{common.edit}" sec:authorize="hasAuthority('PERM_EDIT_DOCTOR')">
                                    <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                                        <path d="M17 3a2.828 2.828 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"></path>
                                    </svg>
                                </a>
                                <a th:href="@{/doctors/delete/{id}(id=${d.id})}" class="action-icon delete confirm-delete" th:title="#{common.delete}" sec:authorize="hasAuthority('PERM_DELETE_DOCTOR')">
                                    <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                                        <polyline points="3 6 5 6 21 6"></polyline>
                                        <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                                    </svg>
                                </a>
                            </div>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(doctors)}">
                        <td colspan="7">
                            <div class="empty-state">
                                <div class="icon">
                                    <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                                        <path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
                                        <circle cx="8.5" cy="7" r="4"></circle>
                                        <polyline points="17 11 19 13 23 9"></polyline>
                                    </svg>
                                </div>
                                <h3 th:text="#{doctor.empty.title}">No doctors yet</h3>
                                <p th:text="#{doctor.empty.subtitle}">Add your first doctor to get started</p>
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
</body>
</html>
