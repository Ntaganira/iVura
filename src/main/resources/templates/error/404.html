<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/sidebar :: html(#{error.notFound}, ~{::content})}">
<head><title>Page Not Found - iVura</title></head>
<body>
<div th:fragment="content">
    <div class="error-page">
        <div style="width:72px;height:72px;margin:0 auto 16px;border-radius:18px;background:var(--primary-light);display:flex;align-items:center;justify-content:center;">
            <svg viewBox="0 0 24 24" style="width:36px;height:36px;stroke:var(--primary);fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;" xmlns="http://www.w3.org/2000/svg">
                <circle cx="11" cy="11" r="8"></circle>
                <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                <line x1="8.5" y1="11" x2="13.5" y2="11"></line>
            </svg>
        </div>
        <h1 th:text="#{error.404}">404</h1>
        <p th:text="#{error.notFound}">Page not found</p>
        <a href="/dashboard" class="btn btn-primary" th:text="#{error.backDashboard}">Go to Dashboard</a>
    </div>
</div>
</body>
</html>
