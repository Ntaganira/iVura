<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:replace="~{layout/sidebar :: html(#{integ.addDevice}, ~{::content})}">
<head><title>New Analyzer - iVura</title></head>
<body>
<div th:fragment="content">
    <div class="page-header">
        <div>
            <h1 th:text="#{integ.addDevice}">Register Analyzer</h1>
            <div class="subtitle" th:text="#{integ.deviceSubtitle}">Connect an analyzer device to the integration gateway</div>
        </div>
    </div>

    <div class="section">
        <form th:action="@{/lab-integration/devices/add}" th:object="${device}" method="post" class="form-container">
            <input type="hidden" name="_csrf" th:value="${_csrf.token}">
            <div class="form-grid">
                <div class="form-group">
                    <label for="name" th:text="#{integ.name}">Name *</label>
                    <input type="text" id="name" th:field="*{name}" required>
                </div>
                <div class="form-group">
                    <label for="code" th:text="#{integ.code}">Code *</label>
                    <input type="text" id="code" th:field="*{code}" required>
                </div>
                <div class="form-group">
                    <label for="model" th:text="#{integ.model}">Model</label>
                    <input type="text" id="model" th:field="*{model}">
                </div>
                <div class="form-group">
                    <label for="interfaceType" th:text="#{integ.interface}">Interface</label>
                    <select id="interfaceType" th:field="*{interfaceType}">
                        <option value="CSV" th:text="#{integ.interface.CSV}">CSV File-Drop</option>
                        <option value="HL7">HL7</option>
                        <option value="LIS2A2">LIS2-A2</option>
                        <option value="ASTM">ASTM</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="endpoint" th:text="#{integ.endpoint}">Endpoint</label>
                    <input type="text" id="endpoint" th:field="*{endpoint}" placeholder="C:/ivura-lab/inbox">
                </div>
            </div>
            <div class="form-actions">
                <button type="submit" class="btn btn-primary" th:text="#{integ.save}">Save Analyzer</button>
                <a href="/lab-integration" class="btn btn-outline" th:text="#{common.cancel}">Cancel</a>
            </div>
        </form>
    </div>
</div>
</body>
</html>
