<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:replace="~{layout/sidebar :: html(#{order.addTitle}, ~{::content})}">
<head><title>New Lab Order - iVura</title></head>
<body>
<div th:fragment="content">
    <div class="page-header">
        <div>
            <h1 th:text="#{order.addTitle}">New Lab Order</h1>
            <div class="subtitle" th:text="#{order.addSubtitle}">Select a patient and the tests to run</div>
        </div>
    </div>

    <div class="section">
        <form th:action="@{/lab-orders/add}" method="post" class="form-container">
            <input type="hidden" name="_csrf" th:value="${_csrf.token}">
            <div class="form-grid">
                <div class="form-group">
                    <label for="patientId" th:text="#{order.patient}">Patient *</label>
                    <select id="patientId" name="patientId" required>
                        <option value="" th:text="#{order.selectPatient}">Select patient</option>
                        <option th:each="p : ${patients}" th:value="${p.id}"
                                th:selected="${patientId != null and p.id == patientId}"
                                th:text="${p.fullName + ' (' + p.patientNumber + ')'}">Alice (PAT-001)</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="doctorId" th:text="#{order.doctor}">Doctor</label>
                    <select id="doctorId" name="doctorId">
                        <option value="" th:text="#{order.selectDoctor}">Select doctor</option>
                        <option th:each="d : ${doctors}" th:value="${d.id}" th:text="${d.fullName}">Dr. Smith</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="priority" th:text="#{order.priority}">Priority</label>
                    <select id="priority" name="priority">
                        <option value="ROUTINE" th:text="#{order.priority.ROUTINE}">Routine</option>
                        <option value="URGENT" th:text="#{order.priority.URGENT}">Urgent</option>
                        <option value="STAT" th:text="#{order.priority.STAT}">STAT</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="specimenType" th:text="#{order.specimenType}">Specimen</label>
                    <input type="text" id="specimenType" name="specimenType" th:placeholder="#{order.specimenPh}">
                </div>
                <div class="form-group">
                    <label for="notes" th:text="#{order.notes}">Notes</label>
                    <textarea id="notes" name="notes" rows="2"></textarea>
                </div>
            </div>

            <div class="form-grid">
                <div class="form-group">
                    <label th:text="#{order.tests}">Tests *</label>
                    <div class="checkbox-grid">
                        <label class="checkbox-item" th:each="t : ${tests}">
                            <input type="checkbox" name="tests" th:value="${t.id}">
                            <span th:text="${t.name + ' (' + t.code + ')'}">CBC (CBC)</span>
                        </label>
                        <p th:if="${#lists.isEmpty(tests)}" class="hint" th:text="#{order.noTests}">No catalog tests defined</p>
                    </div>
                </div>
            </div>

            <div class="form-actions">
                <button type="submit" class="btn btn-primary" th:text="#{order.save}">Place Order</button>
                <a href="/lab-orders" class="btn btn-outline" th:text="#{common.cancel}">Cancel</a>
            </div>
        </form>
    </div>
</div>
</body>
</html>
