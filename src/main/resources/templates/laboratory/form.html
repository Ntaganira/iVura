<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:replace="~{layout/sidebar :: html(${labDto.id == null} ? #{lab.addTitle} : #{lab.editTitle}, ~{::content})}">
<head><title>Lab Result - iVura</title></head>
<body>
<div th:fragment="content">
    <div class="page-header">
        <div>
            <h1 th:text="${labDto.id == null} ? #{lab.addTitle} : #{lab.editTitle}">Lab Result</h1>
            <div class="subtitle" th:text="#{lab.formSubtitle}">Test details and result values</div>
        </div>
        <a href="/laboratory" class="btn btn-outline" th:text="#{common.back}">← Back</a>
    </div>

    <div class="section">
        <form th:action="${labDto.id == null} ? @{/laboratory/add} : @{/laboratory/edit/{id}(id=${labDto.id})}"
              th:object="${labDto}" method="post" class="form-container">
            <div th:replace="~{layout/errors :: error-summary}"></div>

            <div class="form-grid">
                <div class="form-group">
                    <label for="patientId" th:text="#{lab.patient}">Patient *</label>
                    <select id="patientId" th:field="*{patientId}" required>
                        <option value="" th:text="#{med.patientSelect}">Select patient</option>
                        <option th:each="p : ${patients}" th:value="${p.id}" th:text="${p.fullName}">John Doe</option>
                    </select>
                    <span th:if="${#fields.hasErrors('patientId')}" th:errors="*{patientId}" style="color:var(--danger);font-size:12px;"></span>
                </div>
                <div class="form-group">
                    <label for="doctorId" th:text="#{lab.doctor}">Doctor</label>
                    <select id="doctorId" th:field="*{doctorId}">
                        <option value="" th:text="#{med.doctorSelect}">Select doctor</option>
                        <option th:each="d : ${doctors}" th:value="${d.id}" th:text="${d.fullName}">Dr. Smith</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="testName" th:text="#{lab.testName}">Test Name *</label>
                    <input type="text" id="testName" th:field="*{testName}" th:placeholder="#{lab.testNamePh}" required>
                    <span th:if="${#fields.hasErrors('testName')}" th:errors="*{testName}" style="color:var(--danger);font-size:12px;"></span>
                </div>
                <div class="form-group">
                    <label for="category" th:text="#{lab.category}">Category</label>
                    <input type="text" id="category" th:field="*{category}" th:placeholder="#{lab.categoryPh}">
                </div>
                <div class="form-group">
                    <label for="status" th:text="#{lab.statusLabel}">Status</label>
                    <select id="status" th:field="*{status}">
                        <option th:each="s : ${statuses}" th:value="${s}" th:text="#{'lab.status.' + ${s}}">PENDING</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="unit" th:text="#{lab.unit}">Unit</label>
                    <input type="text" id="unit" th:field="*{unit}" th:placeholder="#{lab.unitPh}">
                </div>
                <div class="form-group">
                    <label for="result" th:text="#{lab.result}">Result</label>
                    <input type="text" id="result" th:field="*{result}" th:placeholder="#{lab.resultPh}">
                </div>
                <div class="form-group">
                    <label for="normalRange" th:text="#{lab.normalRange}">Normal Range</label>
                    <input type="text" id="normalRange" th:field="*{normalRange}" th:placeholder="#{lab.normalRangePh}">
                </div>
                <div class="form-group full-width">
                    <label for="notes" th:text="#{med.notes}">Notes</label>
                    <textarea id="notes" th:field="*{notes}" th:placeholder="#{med.notesPh}" rows="3"></textarea>
                </div>
            </div>

            <div class="form-actions">
                <button type="submit" class="btn btn-primary" th:text="${labDto.id == null} ? #{lab.save} : #{lab.update}">Save Lab Result</button>
                <a href="/laboratory" class="btn btn-outline" th:text="#{common.cancel}">Cancel</a>
            </div>
        </form>
    </div>
</div>
</body>
</html>
