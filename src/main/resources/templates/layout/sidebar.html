<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:fragment="html(title, content)" th:lang="${#locale.language}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title} + ' - ' + #{app.name}">iVura - Hospital Management System</title>
    <script>
        (function () {
            var t = localStorage.getItem('ivura-theme');
            if (t !== 'dark') t = 'light';
            document.documentElement.setAttribute('data-theme', t);
        })();
    </script>
    <link rel="stylesheet" href="/css/wecare.css">
    <script th:inline="javascript">
        window.ivuraMessages = {
            confirmDelete: /*[[#{common.confirmDelete}]]*/ 'Are you sure you want to delete this item?',
            theme: {
                light: /*[[#{theme.light}]]*/ 'Light Mode',
                dark: /*[[#{theme.dark}]]*/ 'Dark Mode'
            }
        };
    </script>
    <script defer src="/js/wecare.js"></script>
</head>
<body>

<!-- Sidebar -->
<aside class="sidebar">
    <div class="sidebar-brand">
        <div class="logo-icon">iV</div>
        <h2><span>i</span>Vura</h2>
    </div>
    <nav class="sidebar-menu">
        <div class="menu-label" th:text="#{menu.main}">Main Menu</div>
        <a th:classappend="${#strings.contains(requestURI, '/dashboard') or #strings.contains(requestURI, '/')} ? 'active' : ''" href="/dashboard">
            <span class="icon">
                <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <rect x="3" y="3" width="7" height="7" rx="1.5"></rect>
                    <rect x="14" y="3" width="7" height="7" rx="1.5"></rect>
                    <rect x="14" y="14" width="7" height="7" rx="1.5"></rect>
                    <rect x="3" y="14" width="7" height="7" rx="1.5"></rect>
                </svg>
            </span> <span th:text="#{nav.dashboard}">Dashboard</span>
        </a>
        <a th:classappend="${#strings.contains(requestURI, '/patients')} ? 'active' : ''" href="/patients">
            <span class="icon">
                <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
                    <circle cx="9" cy="7" r="4"></circle>
                    <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
                    <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
                </svg>
            </span> <span th:text="#{nav.patients}">Patients</span>
        </a>
        <a th:classappend="${#strings.contains(requestURI, '/doctors')} ? 'active' : ''" href="/doctors">
            <span class="icon">
                <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
                    <circle cx="8.5" cy="7" r="4"></circle>
                    <polyline points="17 11 19 13 23 9"></polyline>
                </svg>
            </span> <span th:text="#{nav.doctors}">Doctors</span>
        </a>
        <a th:classappend="${#strings.contains(requestURI, '/appointments')} ? 'active' : ''" href="/appointments">
            <span class="icon">
                <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
                    <line x1="16" y1="2" x2="16" y2="6"></line>
                    <line x1="8" y1="2" x2="8" y2="6"></line>
                    <line x1="3" y1="10" x2="21" y2="10"></line>
                </svg>
            </span> <span th:text="#{nav.appointments}">Appointments</span>
        </a>
        <div class="menu-label" style="margin-top:16px;" th:text="#{menu.other}">Other</div>
        <a href="#">
            <span class="icon">
                <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                    <polyline points="9 22 9 12 15 12 15 22"></polyline>
                </svg>
            </span> <span th:text="#{nav.departments}">Departments</span>
        </a>
        <a href="#">
            <span class="icon">
                <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <line x1="12" y1="1" x2="12" y2="23"></line>
                    <path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"></path>
                </svg>
            </span> <span th:text="#{nav.billing}">Billing</span>
        </a>
    </nav>
    <div class="sidebar-footer">
        <a href="/logout">
            <span class="icon">
                <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                    <polyline points="16 17 21 12 16 7"></polyline>
                    <line x1="21" y1="12" x2="9" y2="12"></line>
                </svg>
            </span> <span th:text="#{nav.logout}">Logout</span>
        </a>
    </div>
</aside>

<!-- Main Content -->
<div class="main-content">
    <!-- Header -->
    <header class="header">
        <div class="header-left">
            <h1 th:text="#{header.hospital}">iVura Hospital</h1>
        </div>
        <div class="header-right">
            <div class="search-box">
                <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <circle cx="11" cy="11" r="8"></circle>
                    <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                </svg>
                <input type="text" th:placeholder="#{header.search}">
            </div>
            <button type="button" class="theme-toggle" id="theme-toggle" aria-label="Dark Mode">
                <svg class="icon-moon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
                </svg>
                <svg class="icon-sun" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <circle cx="12" cy="12" r="5"></circle>
                    <line x1="12" y1="1" x2="12" y2="3"></line>
                    <line x1="12" y1="21" x2="12" y2="23"></line>
                    <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
                    <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
                    <line x1="1" y1="12" x2="3" y2="12"></line>
                    <line x1="21" y1="12" x2="23" y2="12"></line>
                    <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
                    <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
                </svg>
            </button>
            <form th:action="${requestURI}" method="get" class="lang-form">
                <select name="lang" class="lang-select" onchange="this.form.submit()" aria-label="Language">
                    <option value="en" th:selected="${#locale.language == 'en'}">EN</option>
                    <option value="fr" th:selected="${#locale.language == 'fr'}">FR</option>
                    <option value="rw" th:selected="${#locale.language == 'rw'}">RW</option>
                </select>
            </form>
            <button class="notif-btn">
                <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
                    <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
                </svg>
                <span class="dot"></span>
            </button>
            <div class="profile">
                <div class="avatar" sec:authorize="isAuthenticated()">
                    <span sec:authentication="principal.username" style="text-transform:uppercase;font-size:14px">A</span>
                </div>
                <div class="info">
                    <div class="name" sec:authorize="isAuthenticated()" sec:authentication="principal.username">Admin</div>
                    <div class="role" sec:authorize="isAuthenticated()">
                        <span sec:authentication="principal.authorities">[ROLE_ADMIN]</span>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <!-- Page Content -->
    <main class="page-content">
        <th:block th:replace="${content}"></th:block>
    </main>
</div>

</body>
</html>
