<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="#{login.welcome}">iVura - Login</title>
    <script>
        (function () {
            var t = localStorage.getItem('ivura-theme');
            if (t !== 'dark') t = 'light';
            document.documentElement.setAttribute('data-theme', t);
        })();
    </script>
    <link rel="stylesheet" href="/css/wecare.css">
    <script defer src="/js/wecare.js"></script>
</head>
<body class="login-page">
    <button type="button" class="theme-toggle" id="theme-toggle" aria-label="Dark Mode">
        <svg class="icon-moon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
        </svg>
        <svg class="icon-sun" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <circle cx="12" cy="12" r="5"></circle>
            <line x1="12" y1="1" x2="12" y2="3"></line>
            <line x1="12" y1="21" x2="12" y2="23"></line>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
            <line x1="1" y1="12" x2="3" y2="12"></line>
            <line x1="21" y1="12" x2="23" y2="12"></line>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
        </svg>
    </button>
    <div class="login-card">
        <div class="login-header">
            <div class="logo">iV</div>
            <h1 th:text="#{login.welcome}">Welcome to iVura</h1>
            <p th:text="#{login.subtitle}">Sign in to your hospital dashboard</p>
        </div>
        <form th:action="@{/login}" method="post">
            <div th:if="${param.error}" class="alert alert-danger" th:text="#{login.error}">
                Invalid username or password
            </div>
            <div th:if="${param.logout}" class="alert alert-info" th:text="#{login.logout}">
                You have been logged out
            </div>
            <div class="form-group">
                <label for="username" th:text="#{login.username}">Username</label>
                <input type="text" id="username" name="username" th:placeholder="#{login.usernamePh}" required autofocus>
            </div>
            <div class="form-group">
                <label for="password" th:text="#{login.password}">Password</label>
                <input type="password" id="password" name="password" th:placeholder="#{login.passwordPh}" required>
            </div>
            <button type="submit" class="btn btn-primary" th:text="#{login.signIn}">Sign In</button>
        </form>
        <div class="login-footer">
            <p th:text="#{login.defaultCredentials}">Default: admin / admin123</p>
        </div>
    </div>
</body>
</html>
