<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:replace="~{layout/sidebar :: html(${recordDto.id == null} ? #{med.addTitle} : #{med.editTitle}, ~{::content})}">
<head><title>Medical Record - iVura</title></head>
<body>
<div th:fragment="content">
    <div class="page-header">
        <div>
            <h1 th:text="${recordDto.id == null} ? #{med.addTitle} : #{med.editTitle}">Medical Record</h1>
            <div class="subtitle" th:text="#{med.formSubtitle}">Diagnosis, prescription and clinical notes</div>
        </div>
        <a href="/medical-records" class="btn btn-outline" th:text="#{common.back}">← Back</a>
    </div>

    <div class="section">
        <form th:action="${recordDto.id == null} ? @{/medical-records/add} : @{/medical-records/edit/{id}(id=${recordDto.id})}"
              th:object="${recordDto}" method="post" class="form-container">
            <div th:replace="~{layout/errors :: error-summary}"></div>

            <div class="form-grid">
                <div class="form-group">
                    <label for="patientId" th:text="#{med.patient}">Patient *</label>
                    <select id="patientId" th:field="*{patientId}" required>
                        <option value="" th:text="#{med.patientSelect}">Select patient</option>
                        <option th:each="p : ${patients}" th:value="${p.id}" th:text="${p.fullName}">John Doe</option>
                    </select>
                    <span th:if="${#fields.hasErrors('patientId')}" th:errors="*{patientId}" style="color:var(--danger);font-size:12px;"></span>
                </div>
                <div class="form-group">
                    <label for="doctorId" th:text="#{med.doctor}">Doctor</label>
                    <select id="doctorId" th:field="*{doctorId}">
                        <option value="" th:text="#{med.doctorSelect}">Select doctor</option>
                        <option th:each="d : ${doctors}" th:value="${d.id}" th:text="${d.fullName}">Dr. Smith</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="appointmentId" th:text="#{med.appointment}">Appointment</label>
                    <select id="appointmentId" th:field="*{appointmentId}">
                        <option value="" th:text="#{med.appointmentSelect}">Not linked</option>
                        <option th:each="a : ${appointments}" th:value="${a.id}"
                                th:text="${a.patient.fullName} + ' · ' + ${a.appointmentDate}">John · 2026-08-08</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="recordDate" th:text="#{med.date}">Record Date</label>
                    <input type="date" id="recordDate" th:field="*{recordDate}">
                </div>
                <div class="form-group full-width">
                    <label for="diagnosis" th:text="#{med.diagnosis}">Diagnosis</label>
                    <textarea id="diagnosis" th:field="*{diagnosis}" th:placeholder="#{med.diagnosisPh}" rows="3"></textarea>
                </div>
                <div class="form-group full-width">
                    <label for="prescription" th:text="#{med.prescription}">Prescription</label>
                    <textarea id="prescription" th:field="*{prescription}" th:placeholder="#{med.prescriptionPh}" rows="3"></textarea>
                </div>
                <div class="form-group full-width">
                    <label for="notes" th:text="#{med.notes}">Notes</label>
                    <textarea id="notes" th:field="*{notes}" th:placeholder="#{med.notesPh}" rows="3"></textarea>
                </div>
            </div>

            <div class="form-actions">
                <button type="submit" class="btn btn-primary" th:text="${recordDto.id == null} ? #{med.save} : #{med.update}">Save Record</button>
                <a href="/medical-records" class="btn btn-outline" th:text="#{common.cancel}">Cancel</a>
            </div>
        </form>
    </div>
</div>
</body>
</html>
