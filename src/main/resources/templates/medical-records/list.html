<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:replace="~{layout/sidebar :: html(#{med.title}, ~{::content})}">
<head><title>Medical Records - iVura</title></head>
<body>
<div th:fragment="content">
    <div class="page-header">
        <div>
            <h1 th:text="#{med.title}">Medical Records</h1>
            <div class="subtitle" th:text="#{med.subtitle}">Diagnoses, prescriptions and clinical notes</div>
        </div>
        <a href="/medical-records/add" class="btn btn-primary" sec:authorize="hasAuthority('PERM_CREATE_RECORD')">
            <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <line x1="12" y1="5" x2="12" y2="19"></line>
                <line x1="5" y1="12" x2="19" y2="12"></line>
            </svg>
            <span th:text="#{med.add}">Add Record</span>
        </a>
    </div>

    <div class="section">
        <div class="section-header">
            <h2>
                <span th:text="#{med.sectionTitle}">Record List</span>
                <span class="section-count" th:text="${total}">0</span>
            </h2>
        </div>
        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th th:text="#{med.table.patient}">Patient</th>
                        <th th:text="#{med.table.doctor}">Doctor</th>
                        <th th:text="#{med.table.date}">Date</th>
                        <th th:text="#{med.table.diagnosis}">Diagnosis</th>
                        <th th:text="#{med.table.prescription}">Prescription</th>
                        <th th:text="#{common.actions}">Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="r : ${records.content}">
                        <td>
                            <div class="patient-cell">
                                <div class="avatar green" th:text="${#strings.substring(r.patient.fullName, 0, 1)}">J</div>
                                <div class="info">
                                    <div class="name" th:text="${r.patient.fullName}">John Doe</div>
                                    <div class="hint" th:text="${r.recordDate}">2026-08-08</div>
                                </div>
                            </div>
                        </td>
                        <td th:text="${r.doctor != null ? r.doctor.fullName : '-'}">Dr. Smith</td>
                        <td th:text="${#temporals.format(r.recordDate, 'dd MMM yyyy')}">08 Aug 2026</td>
                        <td>
                            <div class="cell-truncate" th:title="${r.diagnosis}" th:text="${r.diagnosis}">Flu</div>
                        </td>
                        <td>
                            <div class="cell-truncate" th:title="${r.prescription}" th:text="${r.prescription}">Paracetamol 500mg</div>
                        </td>
                        <td>
                            <div class="btn-group">
                                <a th:href="@{/patients/{id}/history(id=${r.patient.id})}" class="action-icon view"
                                   th:title="#{med.history}">
                                    <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                                        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                        <circle cx="12" cy="12" r="3"></circle>
                                    </svg>
                                </a>
                                <a th:href="@{/medical-records/edit/{id}(id=${r.id})}" class="action-icon edit"
                                   th:title="#{common.edit}" sec:authorize="hasAuthority('PERM_EDIT_RECORD')">
                                    <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                                        <path d="M17 3a2.828 2.828 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"></path>
                                    </svg>
                                </a>
                                <a th:href="@{/medical-records/delete/{id}(id=${r.id})}" class="action-icon delete confirm-delete"
                                   th:title="#{common.delete}" th:attr="data-confirm=#{med.deleteConfirm}"
                                   sec:authorize="hasAuthority('PERM_DELETE_RECORD')">
                                    <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                                        <polyline points="3 6 5 6 21 6"></polyline>
                                        <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                                    </svg>
                                </a>
                            </div>
                        </td>
                    </tr>
                    <tr th:if="${records.totalElements == 0}">
                        <td colspan="6">
                            <div class="empty-state">
                                <div class="icon">
                                    <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                                        <path d="M22 12h-4l-3 9L9 3l-3 9H2"></path>
                                    </svg>
                                </div>
                                <h3 th:text="#{med.empty.title}">No medical records yet</h3>
                                <p th:text="#{med.empty.subtitle}">Record the first diagnosis for a patient</p>
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
        <th:block th:replace="~{layout/pagination :: pager(${records}, '/medical-records', ${paginationQuery})}"></th:block>
    </div>
</div>
</body>
</html>
