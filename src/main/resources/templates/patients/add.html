<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/sidebar :: html(#{patient.addTitle}, ~{::content})}">
<head><title>Add Patient - iVura</title></head>
<body>
<div th:fragment="content">
    <div class="page-header">
        <div>
            <h1 th:text="#{patient.addTitle}">Add Patient</h1>
            <div class="subtitle" th:text="#{patient.addSubtitle}">Register a new patient</div>
        </div>
        <a href="/patients" class="btn btn-outline" th:text="#{common.back}">← Back</a>
    </div>

    <div class="section">
        <form th:action="@{/patients/add}" th:object="${patientDto}" method="post" class="form-container">
            <div th:replace="~{layout/errors :: error-summary}"></div>

            <div class="form-grid">
                <div class="form-group">
                    <label for="firstName" th:text="#{patient.firstName}">First Name *</label>
                    <input type="text" id="firstName" th:field="*{firstName}" th:placeholder="#{patient.firstNamePh}" required>
                    <span th:if="${#fields.hasErrors('firstName')}" th:errors="*{firstName}" style="color:var(--danger);font-size:12px;"></span>
                </div>
                <div class="form-group">
                    <label for="lastName" th:text="#{patient.lastName}">Last Name *</label>
                    <input type="text" id="lastName" th:field="*{lastName}" th:placeholder="#{patient.lastNamePh}" required>
                    <span th:if="${#fields.hasErrors('lastName')}" th:errors="*{lastName}" style="color:var(--danger);font-size:12px;"></span>
                </div>
                <div class="form-group">
                    <label for="email" th:text="#{patient.email}">Email</label>
                    <input type="email" id="email" th:field="*{email}" th:placeholder="#{patient.emailPh}">
                </div>
                <div class="form-group">
                    <label for="phone" th:text="#{patient.phone}">Phone</label>
                    <input type="text" id="phone" th:field="*{phone}" th:placeholder="#{patient.phonePh}">
                </div>
                <div class="form-group">
                    <label for="dateOfBirth" th:text="#{patient.dob}">Date of Birth</label>
                    <input type="date" id="dateOfBirth" th:field="*{dateOfBirth}">
                </div>
                <div class="form-group">
                    <label for="gender" th:text="#{patient.gender}">Gender</label>
                    <select id="gender" th:field="*{gender}">
                        <option value="" th:text="#{patient.genderSelect}">Select gender</option>
                        <option value="MALE" th:text="#{patient.gender.male}">Male</option>
                        <option value="FEMALE" th:text="#{patient.gender.female}">Female</option>
                        <option value="OTHER" th:text="#{patient.gender.other}">Other</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="bloodGroup" th:text="#{patient.bloodGroup}">Blood Group</label>
                    <select id="bloodGroup" th:field="*{bloodGroup}">
                        <option value="" th:text="#{patient.bloodSelect}">Select</option>
                        <option value="A+">A+</option>
                        <option value="A-">A-</option>
                        <option value="B+">B+</option>
                        <option value="B-">B-</option>
                        <option value="AB+">AB+</option>
                        <option value="AB-">AB-</option>
                        <option value="O+">O+</option>
                        <option value="O-">O-</option>
                    </select>
                </div>
                <div class="form-group full-width">
                    <label for="address" th:text="#{patient.address}">Address</label>
                    <textarea id="address" th:field="*{address}" th:placeholder="#{patient.addressPh}"></textarea>
                </div>
                <div class="form-group">
                    <label for="city" th:text="#{patient.city}">City</label>
                    <input type="text" id="city" th:field="*{city}" th:placeholder="#{patient.cityPh}">
                </div>
                <div class="form-group">
                    <label for="state" th:text="#{patient.state}">State/Province</label>
                    <input type="text" id="state" th:field="*{state}" th:placeholder="#{patient.statePh}">
                </div>
                <div class="form-group">
                    <label for="emergencyContactName" th:text="#{patient.emergencyName}">Emergency Contact Name</label>
                    <input type="text" id="emergencyContactName" th:field="*{emergencyContactName}" th:placeholder="#{patient.emergencyNamePh}">
                </div>
                <div class="form-group">
                    <label for="emergencyContactPhone" th:text="#{patient.emergencyPhone}">Emergency Contact Phone</label>
                    <input type="text" id="emergencyContactPhone" th:field="*{emergencyContactPhone}" th:placeholder="#{patient.emergencyPhonePh}">
                </div>
                <div class="form-group full-width">
                    <label for="medicalHistory" th:text="#{patient.medicalHistory}">Medical History</label>
                    <textarea id="medicalHistory" th:field="*{medicalHistory}" th:placeholder="#{patient.medicalHistoryPh}"></textarea>
                </div>
                <div class="form-group full-width">
                    <label for="allergies" th:text="#{patient.allergies}">Allergies</label>
                    <textarea id="allergies" th:field="*{allergies}" th:placeholder="#{patient.allergiesPh}"></textarea>
                </div>
            </div>

            <div class="form-actions">
                <button type="submit" class="btn btn-primary" th:text="#{patient.save}">Save Patient</button>
                <a href="/patients" class="btn btn-outline" th:text="#{common.cancel}">Cancel</a>
            </div>
        </form>
    </div>
</div>
</body>
</html>
