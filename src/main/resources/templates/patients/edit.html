<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/sidebar :: html(#{patient.editTitle}, ~{::content})}">
<head><title>Edit Patient - iVura</title></head>
<body>
<div th:fragment="content">
    <div class="page-header">
        <div>
            <h1 th:text="#{patient.editTitle}">Edit Patient</h1>
            <div class="subtitle" th:text="#{patient.editSubtitle}">Update patient information</div>
        </div>
        <a href="/patients" class="btn btn-outline" th:text="#{common.back}">← Back</a>
    </div>

    <div class="section">
        <form th:action="@{/patients/edit/{id}(id=${patientDto.id})}" th:object="${patientDto}" method="post" class="form-container">
            <div th:replace="~{layout/errors :: error-summary}"></div>

            <div class="form-grid">
                <div class="form-group">
                    <label for="firstName" th:text="#{patient.firstName}">First Name *</label>
                    <input type="text" id="firstName" th:field="*{firstName}" required>
                    <span th:if="${#fields.hasErrors('firstName')}" th:errors="*{firstName}" style="color:var(--danger);font-size:12px;"></span>
                </div>
                <div class="form-group">
                    <label for="lastName" th:text="#{patient.lastName}">Last Name *</label>
                    <input type="text" id="lastName" th:field="*{lastName}" required>
                    <span th:if="${#fields.hasErrors('lastName')}" th:errors="*{lastName}" style="color:var(--danger);font-size:12px;"></span>
                </div>
                <div class="form-group">
                    <label for="email" th:text="#{patient.email}">Email</label>
                    <input type="email" id="email" th:field="*{email}">
                </div>
                <div class="form-group">
                    <label for="phone" th:text="#{patient.phone}">Phone</label>
                    <input type="text" id="phone" th:field="*{phone}">
                </div>
                <div class="form-group">
                    <label for="dateOfBirth" th:text="#{patient.dob}">Date of Birth</label>
                    <input type="date" id="dateOfBirth" th:field="*{dateOfBirth}">
                </div>
                <div class="form-group">
                    <label for="gender" th:text="#{patient.gender}">Gender</label>
                    <select id="gender" th:field="*{gender}">
                        <option value="" th:text="#{patient.genderSelect}">Select gender</option>
                        <option value="MALE" th:text="#{patient.gender.male}">Male</option>
                        <option value="FEMALE" th:text="#{patient.gender.female}">Female</option>
                        <option value="OTHER" th:text="#{patient.gender.other}">Other</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="bloodGroup" th:text="#{patient.bloodGroup}">Blood Group</label>
                    <select id="bloodGroup" th:field="*{bloodGroup}">
                        <option value="" th:text="#{patient.bloodSelect}">Select</option>
                        <option value="A+">A+</option>
                        <option value="A-">A-</option>
                        <option value="B+">B+</option>
                        <option value="B-">B-</option>
                        <option value="AB+">AB+</option>
                        <option value="AB-">AB-</option>
                        <option value="O+">O+</option>
                        <option value="O-">O-</option>
                    </select>
                </div>
                <div class="form-group full-width">
                    <label for="address" th:text="#{patient.address}">Address</label>
                    <textarea id="address" th:field="*{address}"></textarea>
                </div>
                <div class="form-group">
                    <label for="city" th:text="#{patient.city}">City</label>
                    <input type="text" id="city" th:field="*{city}">
                </div>
                <div class="form-group">
                    <label for="state" th:text="#{patient.state}">State/Province</label>
                    <input type="text" id="state" th:field="*{state}">
                </div>
                <div class="form-group">
                    <label for="emergencyContactName" th:text="#{patient.emergencyName}">Emergency Contact</label>
                    <input type="text" id="emergencyContactName" th:field="*{emergencyContactName}">
                </div>
                <div class="form-group">
                    <label for="emergencyContactPhone" th:text="#{patient.emergencyPhone}">Emergency Phone</label>
                    <input type="text" id="emergencyContactPhone" th:field="*{emergencyContactPhone}">
                </div>
                <div class="form-group full-width">
                    <label for="medicalHistory" th:text="#{patient.medicalHistory}">Medical History</label>
                    <textarea id="medicalHistory" th:field="*{medicalHistory}"></textarea>
                </div>
                <div class="form-group full-width">
                    <label for="allergies" th:text="#{patient.allergies}">Allergies</label>
                    <textarea id="allergies" th:field="*{allergies}"></textarea>
                </div>
                <div class="form-group full-width" style="border-top:1px solid var(--gray-200);padding-top:16px;">
                    <h3 style="margin:0 0 4px;font-size:15px;" th:text="#{patient.insuranceSection}">Insurance Details</h3>
                    <label class="checkbox-line" style="display:flex;align-items:center;gap:8px;margin-top:8px;">
                        <input type="checkbox" th:field="*{hasInsurance}">
                        <span th:text="#{patient.hasInsurance}">Patient has insurance</span>
                    </label>
                </div>
                <div class="form-group">
                    <label for="insuranceProvider" th:text="#{patient.insuranceProvider}">Insurance Provider</label>
                    <input type="text" id="insuranceProvider" th:field="*{insuranceProvider}">
                </div>
                <div class="form-group">
                    <label for="insurancePolicyNumber" th:text="#{patient.insurancePolicy}">Policy Number</label>
                    <input type="text" id="insurancePolicyNumber" th:field="*{insurancePolicyNumber}">
                </div>
                <div class="form-group">
                    <label for="insuranceMemberName" th:text="#{patient.insuranceMember}">Member Name</label>
                    <input type="text" id="insuranceMemberName" th:field="*{insuranceMemberName}">
                </div>
                <div class="form-group">
                    <label for="insuranceExpiryDate" th:text="#{patient.insuranceExpiry}">Expiry Date</label>
                    <input type="date" id="insuranceExpiryDate" th:field="*{insuranceExpiryDate}">
                </div>
                <div class="form-group full-width" style="border-top:1px solid var(--gray-200);padding-top:16px;">
                    <h3 style="margin:0 0 4px;font-size:15px;" th:text="#{patient.consentSection}">Digital Consent Signature</h3>
                    <div class="signature-preview" th:if="${patientDto.signatureData != null and !#strings.isEmpty(patientDto.signatureData)}">
                        <img th:src="${patientDto.signatureData}" alt="Signature" style="max-height:90px;border:1px solid var(--gray-200);border-radius:8px;">
                    </div>
                    <label class="checkbox-line" style="display:flex;align-items:center;gap:8px;margin:8px 0;">
                        <input type="checkbox" id="consentGiven" th:field="*{consentGiven}">
                        <span th:text="#{patient.consentGiven}">I consent to treatment</span>
                    </label>
                    <div class="signature-pad" id="signaturePad">
                        <canvas id="sigCanvas" width="520" height="180"></canvas>
                    </div>
                    <input type="hidden" id="signatureData" th:field="*{signatureData}">
                    <button type="button" class="btn btn-outline btn-sm" id="sigClear"
                            th:text="#{patient.sigClear}">Clear Signature</button>
                </div>
            </div>
            <script th:inline="javascript" th:src="@{/js/signature-pad.js}"></script>
            <script>
                ivuraSignaturePad.init('sigCanvas', 'signatureData', 'sigClear');
            </script>

            <div class="form-actions">
                <button type="submit" class="btn btn-primary" th:text="#{patient.update}">Update Patient</button>
                <a href="/patients" class="btn btn-outline" th:text="#{common.cancel}">Cancel</a>
            </div>
        </form>
    </div>
</div>
</body>
</html>
