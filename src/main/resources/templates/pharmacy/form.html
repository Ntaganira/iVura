<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/sidebar :: html(${medicine.id != null} ? #{ph.editTitle} : #{ph.addTitle}, ~{::content})}">
<head><title>Medicine - iVura</title></head>
<body>
<div th:fragment="content">
    <div class="page-header">
        <div>
            <h1 th:text="${medicine.id != null} ? #{ph.editTitle} : #{ph.addTitle}">Medicine</h1>
            <div class="subtitle" th:text="#{ph.formSubtitle}">Medicine details and stock levels</div>
        </div>
        <a href="/pharmacy" class="btn btn-outline" th:text="#{common.back}">← Back</a>
    </div>

    <div class="section">
        <form th:action="${medicine.id != null} ? @{/pharmacy/edit/{id}(id=${medicine.id})} : @{/pharmacy/add}"
              th:object="${medicine}" method="post" class="form-container">
            <div class="form-grid">
                <div class="form-group">
                    <label for="name" th:text="#{ph.name}">Name *</label>
                    <input type="text" id="name" th:field="*{name}" th:placeholder="#{ph.namePh}" required>
                </div>
                <div class="form-group">
                    <label for="category" th:text="#{ph.category}">Category</label>
                    <input type="text" id="category" th:field="*{category}" th:placeholder="#{ph.categoryPh}">
                </div>
                <div class="form-group">
                    <label for="batchNumber" th:text="#{ph.batch}">Batch Number</label>
                    <input type="text" id="batchNumber" th:field="*{batchNumber}" th:placeholder="#{ph.batchPh}">
                </div>
                <div class="form-group">
                    <label for="manufacturer" th:text="#{ph.manufacturer}">Manufacturer</label>
                    <input type="text" id="manufacturer" th:field="*{manufacturer}" th:placeholder="#{ph.manufacturerPh}">
                </div>
                <div class="form-group">
                    <label for="dosage" th:text="#{ph.dosage}">Dosage</label>
                    <input type="text" id="dosage" th:field="*{dosage}" th:placeholder="#{ph.dosagePh}">
                </div>
                <div class="form-group">
                    <label for="unit" th:text="#{ph.unit}">Unit</label>
                    <input type="text" id="unit" th:field="*{unit}" th:placeholder="#{ph.unitPh}">
                </div>
                <div class="form-group">
                    <label for="stockQuantity" th:text="#{ph.stock}">Stock Quantity</label>
                    <input type="number" id="stockQuantity" th:field="*{stockQuantity}" min="0" value="0">
                </div>
                <div class="form-group">
                    <label for="reorderLevel" th:text="#{ph.reorder}">Reorder Level</label>
                    <input type="number" id="reorderLevel" th:field="*{reorderLevel}" min="0" value="10">
                </div>
                <div class="form-group">
                    <label for="unitPrice" th:text="#{ph.price}">Unit Price (RWF)</label>
                    <input type="number" step="0.01" min="0" id="unitPrice" th:field="*{unitPrice}" value="0.00">
                </div>
                <div class="form-group">
                    <label for="expiryDate" th:text="#{ph.expiry}">Expiry Date</label>
                    <input type="date" id="expiryDate" th:field="*{expiryDate}">
                </div>
            </div>

            <div class="form-actions">
                <button type="submit" class="btn btn-primary"
                        th:text="${medicine.id != null} ? #{common.update} : #{ph.save}">Save</button>
                <a href="/pharmacy" class="btn btn-outline" th:text="#{common.cancel}">Cancel</a>
            </div>
        </form>
    </div>
</div>
</body>
</html>
