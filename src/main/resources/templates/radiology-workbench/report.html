<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:replace="~{layout/sidebar :: html(#{radwb.writeTitle}, ~{::content})}">
<head><title>Write Report - iVura</title></head>
<body>
<div th:fragment="content">
    <div class="page-header">
        <div>
            <h1 th:text="#{radwb.writeTitle}">Write Report</h1>
            <div class="subtitle" th:text="${item.examName} + ' - ' + ${item.order.patient.fullName}">Chest X-Ray - Alice</div>
        </div>
        <a href="/radiology-workbench" class="btn btn-outline" th:text="#{verify.back}">Back to workbench</a>
    </div>

    <div class="section">
        <div class="section-header">
            <h2 th:text="#{radwb.examSummary}">Exam Summary</h2>
        </div>
        <div class="summary-grid">
            <div class="summary-card">
                <div class="icon blue">
                    <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                        <circle cx="12" cy="7" r="4"></circle>
                    </svg>
                </div>
                <div class="info">
                    <div class="value" th:text="${item.order.patient.fullName}">Alice Niyonkuru</div>
                    <div class="label" th:text="#{radwb.table.patient}">Patient</div>
                </div>
            </div>
            <div class="summary-card">
                <div class="icon green">
                    <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path d="M3 7l6-3 6 3 6-3v13l-6 3-6-3-6 3z"></path>
                        <line x1="9" y1="4" x2="9" y2="17"></line>
                        <line x1="15" y1="7" x2="15" y2="20"></line>
                    </svg>
                </div>
                <div class="info">
                    <div class="value" th:text="${item.examName}">Chest X-Ray</div>
                    <div class="label" th:text="#{radwb.table.exam}">Exam</div>
                </div>
            </div>
            <div class="summary-card">
                <div class="icon">
                    <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                        <polyline points="14 2 14 8 20 8"></polyline>
                    </svg>
                </div>
                <div class="info">
                    <div class="value" th:text="${item.order.accessionNumber}">IMAG-2026-000001</div>
                    <div class="label" th:text="#{radwb.table.accession}">Accession</div>
                </div>
            </div>
        </div>
    </div>

    <div class="section">
        <div class="section-header">
            <h2 th:text="#{radwb.reportForm}">Report</h2>
        </div>
        <form th:action="@{/radiology-workbench/submit/{id}(id=${item.id})}" method="post" class="form-container">
            <input type="hidden" name="_csrf" th:value="${_csrf.token}">
            <div class="form-grid">
                <div class="form-group" style="grid-column: 1 / -1;">
                    <label for="clinicalHistory" th:text="#{radwb.clinicalHistory}">Clinical History</label>
                    <textarea id="clinicalHistory" name="clinicalHistory" rows="2"
                              th:text="${report != null ? report.clinicalHistory : ''}"></textarea>
                </div>
                <div class="form-group" style="grid-column: 1 / -1;">
                    <label for="findings" th:text="#{radwb.findings}">Findings *</label>
                    <textarea id="findings" name="findings" rows="6"
                              th:text="${report != null ? report.findings : ''}"></textarea>
                </div>
                <div class="form-group" style="grid-column: 1 / -1;">
                    <label for="impression" th:text="#{radwb.impression}">Impression *</label>
                    <textarea id="impression" name="impression" rows="3"
                              th:text="${report != null ? report.impression : ''}"></textarea>
                </div>
            </div>
            <div class="form-actions">
                <button type="submit" class="btn btn-primary" th:text="#{radwb.submit}">Submit for Verification</button>
                <button type="submit" class="btn btn-outline" formaction="@{/radiology-workbench/save/{id}(id=${item.id})}"
                        th:text="#{radwb.saveDraft}">Save Draft</button>
                <a href="/radiology-workbench" class="btn btn-outline" th:text="#{common.cancel}">Cancel</a>
            </div>
        </form>
    </div>
</div>
</body>
</html>
