<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:replace="~{layout/sidebar :: html(${specializationDto.id == null} ? #{spec.addTitle} : #{spec.editTitle}, ~{::content})}">
<head><title>Specialization - iVura</title></head>
<body>
<div th:fragment="content">
    <div class="page-header">
        <div>
            <h1 th:text="${specializationDto.id == null} ? #{spec.addTitle} : #{spec.editTitle}">Specialization</h1>
            <div class="subtitle" th:text="${specializationDto.id == null} ? #{spec.addSubtitle} : #{spec.editSubtitle}">Specialization details</div>
        </div>
        <a href="/specializations" class="btn btn-outline" th:text="#{common.back}">← Back</a>
    </div>

    <div class="section">
        <form th:action="${specializationDto.id == null} ? @{/specializations/add} : @{/specializations/edit/{id}(id=${specializationDto.id})}"
              th:object="${specializationDto}" method="post" class="form-container">
            <div th:replace="~{layout/errors :: error-summary}"></div>

            <div class="form-grid">
                <div class="form-group">
                    <label for="name" th:text="#{spec.name}">Specialization Name *</label>
                    <input type="text" id="name" th:field="*{name}" th:placeholder="#{spec.namePh}" required>
                    <span th:if="${#fields.hasErrors('name')}" th:errors="*{name}" style="color:var(--danger);font-size:12px;"></span>
                </div>
                <div class="form-group">
                    <label for="price" th:text="#{spec.price}">Price (RWF) *</label>
                    <input type="number" id="price" th:field="*{price}" step="0.01" min="0" required>
                    <span th:if="${#fields.hasErrors('price')}" th:errors="*{price}" style="color:var(--danger);font-size:12px;"></span>
                </div>
                <div class="form-group full-width">
                    <label for="description" th:text="#{spec.description}">Description</label>
                    <textarea id="description" th:field="*{description}" th:placeholder="#{spec.descriptionPh}"></textarea>
                </div>
            </div>

            <div class="form-actions">
                <button type="submit" class="btn btn-primary" th:text="${specializationDto.id == null} ? #{spec.save} : #{spec.update}">Save Specialization</button>
                <a href="/specializations" class="btn btn-outline" th:text="#{common.cancel}">Cancel</a>
            </div>
        </form>
    </div>
</div>
</body>
</html>
